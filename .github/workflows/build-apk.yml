name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # По умолчанию экшен ставит пакет `tools`, которого в репозитории SDK
          # больше нет, и шаг падает (сборка #44548262520). Нужные платформы
          # Gradle докачает сам, лицензии экшен принимает.
          packages: ''

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor web assets into Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tactical-mind-body-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Artifact downloads require a GitHub login, which is awkward on a phone.
      # A release asset is a stable, login-free URL:
      #   .../releases/latest/download/tactical-mind-body-debug.apk
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk tactical-mind-body-debug.apk
          gh release create "build-${{ github.run_number }}" tactical-mind-body-debug.apk \
            --title "Debug build #${{ github.run_number }}" \
            --notes "Автосборка из \`${GITHUB_SHA:0:7}\` — $(git log -1 --pretty=%s)

          Debug-версия для установки на свои устройства (разрешите установку из неизвестных источников).
          Постоянная ссылка на свежую сборку: https://github.com/${{ github.repository }}/releases/latest/download/tactical-mind-body-debug.apk" \
            --latest
